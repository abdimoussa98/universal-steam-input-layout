[package]
name = "keybind-overlay"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "keybind-overlay"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
ui = ["dep:eframe"]
desktop = ["ui", "dep:sdl3", "dep:windows", "dep:winit", "dep:tiny_http", "dep:getrandom"]
web = ["ui", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:js-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
eframe = { version = "=0.31.1", default-features = false, features = ["default_fonts", "glow"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"], optional = true }
winit = { version = "0.30", optional = true }
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
sdl3 = { version = "=0.20.0", features = ["build-from-source-static"], optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = { version = "0.12", optional = true }
getrandom = { version = "0.3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Window", "Performance", "Document", "Navigator", "Gamepad", "GamepadButton", "GamepadMappingType", "HtmlCanvasElement", "Storage", "Response", "RequestInit", "Headers", "Location", "AbortSignal"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

# Rust already optimizes for size. wasm-pack 0.13.1 bundles an older wasm-opt
# that rejects bulk-memory operations emitted by current Rust toolchains.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[[example]]
name = "companion_fixture"
required-features = ["desktop"]
