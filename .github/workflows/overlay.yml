name: Keybind viewer
on:
  push:
    paths: ['overlay/**', 'steam_layout/overlay_profile.py', 'tools/export_overlay_profile.py', 'tests/integration/profiles/test_overlay_profile.py', 'steam_layout/model.py', 'steam_layout/flow_model.py', 'versions/**', 'steam_layout/controllers.py', 'tools/release.py', '.github/workflows/overlay.yml']
  pull_request:
    paths: ['overlay/**', 'steam_layout/overlay_profile.py', 'tools/export_overlay_profile.py', 'tests/integration/profiles/test_overlay_profile.py', 'steam_layout/model.py', 'steam_layout/flow_model.py', 'versions/**', 'steam_layout/controllers.py', 'tools/release.py', '.github/workflows/overlay.yml']
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: read
jobs:
  quality:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 overlay/scripts/check_rust_size.py
      - run: cargo fmt --manifest-path overlay/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path overlay/Cargo.toml --all-targets --no-default-features -- -D warnings
      - run: cargo test --locked --manifest-path overlay/Cargo.toml --no-default-features
      - run: cargo clippy --locked --manifest-path overlay/Cargo.toml --all-targets --target wasm32-unknown-unknown --features web -- -D warnings
  macos:
    needs: quality
    if: github.event_name != 'workflow_run'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: clippy
      - run: cargo clippy --locked --manifest-path overlay/Cargo.toml --all-targets --features desktop -- -D warnings
      - run: cargo test --locked --manifest-path overlay/Cargo.toml --features desktop
      - run: cargo build --locked --manifest-path overlay/Cargo.toml --release --features desktop
      - uses: actions/upload-artifact@v4
        with:
          name: keybind-viewer-macos-helper
          path: overlay/target/release/keybind-overlay
  windows:
    needs: quality
    if: github.event_name != 'workflow_run'
    runs-on: windows-latest
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/overlay/cmake/windows-static-crt.cmake
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: clippy
      - run: cargo clippy --locked --manifest-path overlay/Cargo.toml --all-targets --features desktop -- -D warnings
      - run: cargo test --locked --manifest-path overlay/Cargo.toml --features desktop
      - run: cargo build --locked --manifest-path overlay/Cargo.toml --release --features desktop
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python overlay/scripts/package_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: keybind-viewer-windows
          path: overlay/windows-bundle/
  web:
    needs: quality
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - name: Check downloads and packaging
        run: |
          node --test overlay/scripts/test_downloads.mjs overlay/scripts/test_webhid.mjs
          python3 -m unittest discover -s overlay/scripts -p 'test_*.py'
      - run: python3 overlay/scripts/build_web.py
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          # Keep aligned with scripts/browser_linux.Dockerfile for reproduction.
          chrome-version: '155.0.8059.84'
          install-chromedriver: true
      - name: Test WASM behavior and the packaged viewer
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/overlay-webdriver.json
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['WASM_BINDGEN_TEST_WEBDRIVER_JSON']).write_text(json.dumps({
              'goog:chromeOptions': {'binary': os.environ['CHROME_BIN'], 'args': ['--no-sandbox']}
          }))
          PY
          wasm-pack test --headless --chrome --chromedriver "$CHROMEDRIVER" overlay --no-default-features
          python3 -u overlay/scripts/browser_smoke.py --bundle overlay/dist --webhid --webdriver-delay-ms 650 --driver "$CHROMEDRIVER" --browser-binary "$CHROME_BIN"
      - name: Record the release
        run: python3 overlay/scripts/release_manifest.py --bundle overlay/dist --revision "$GITHUB_SHA"
      - name: Build the web container
        run: |
          docker build -f overlay/deploy/Dockerfile -t keybind-web:build --build-arg REVISION="$GITHUB_SHA" --build-arg SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" overlay
          docker save keybind-web:build -o "$RUNNER_TEMP/keybind-web-image.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: keybind-viewer-image
          path: ${{ runner.temp }}/keybind-web-image.tar
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: keybind-viewer-web
          path: overlay/dist/
          if-no-files-found: error
  publish-web:
    name: Publish web image
    needs: web
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: keybind-web-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keybind-viewer-image
          path: image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the built image
        run: |
          docker load -i image/keybind-web-image.tar
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-web"
          image="$repository:$GITHUB_SHA"
          docker tag keybind-web:build "$image"
          docker push "$image"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")
          [[ "$digest" == ghcr.io/*@sha256:* ]]
          echo "Published web image: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          # An older, slower build must not replace a newer latest image.
          current=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$current" = "$GITHUB_SHA" ]; then
            docker tag "$image" "$repository:latest"
            docker push "$repository:latest"
            echo "Dockge image: \`$repository:latest\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'A newer main commit exists; leaving latest unchanged.' >> "$GITHUB_STEP_SUMMARY"
          fi
